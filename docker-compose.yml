services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app                # Mount source for live editing
      - venv:/app/.venv       # Preserve the image's venv (not overwritten by source mount)
    env_file:
      - path: config/.env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
    ports:
      - "8001:8000"
    command: sleep infinity

volumes:
  venv:
