[project]
name = "autogen-test"
version = "0.1.0"
description = "Autogen playground for my Agent development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autogen-agentchat>=0.7.5",
    "autogen-core>=0.7.5",
    "autogen-ext[ollama,openai]>=0.7.5",
    "dotenv>=0.9.9",
    "ipython>=9.6.0",
    "pandas>=2.3.3",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.3.0",
    "rich>=14.2.0",
    "fastapi>=0.114.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.4.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "email-validator>=2.3.0",
    "pytest>=8.4.2",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "en-core-web-lg",
    "sqlalchemy[asyncio]>=2.0.48",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "google-auth-oauthlib>=1.3.0",
    "google-api-python-client>=2.193.0",
    "google-auth-httplib2>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.20.2",
    "ruff>=0.6.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203", "E266"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.3",
]
